# Environment "dev" (backend laundry-dev): Firestore database laundrydb-dev.
env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: dev
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE
    value: laundrydb-dev
    availability: [BUILD, RUNTIME]
  # Partner API key(s) for River Mobile (X-River-Key). Secret value may hold several keys, comma-separated.
  # Rotate: firebase apphosting:secrets:set river-api-key-dev --project mylaundryph, then redeploy.
  # AI Companion on for dev only.
  - variable: COMPANION_ENABLED
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: RIVER_API_KEYS
    secret: river-api-key-dev
    availability: [RUNTIME]
