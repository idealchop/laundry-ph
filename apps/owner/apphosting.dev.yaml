# Environment "dev" (backend laundry-dev): Firestore database laundrydb-dev.
env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: dev
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE
    value: laundrydb-dev
    availability: [BUILD, RUNTIME]
  # River Bridge (Partner API /api/v1). Names only — never secret values here.
  # Audience = laundry-dev origin only. Tokens minted for laundry-prod (or origin + /api/v1) are rejected.
  - variable: RIVER_BRIDGE_OIDC_AUDIENCE
    value: "https://laundry-dev--mylaundryph.asia-southeast1.hosted.app"
    availability: [RUNTIME]
  # Exactly the River Bridge dev service account (rivermobile-ph).
  - variable: RIVER_BRIDGE_SERVICE_ACCOUNTS
    value: "248617671827-compute@developer.gserviceaccount.com"
    availability: [RUNTIME]
  - variable: RIVER_BRIDGE_SCOPES
    value: "shops:read,orders:read,orders:write"
    availability: [RUNTIME]
  # Request-direction key ids. Each maps to the mylaundryph Secret Manager secret of the same name
  # (projects/mylaundryph/secrets/<key id>/versions/latest), read at runtime by the backend's service
  # account. Until those secrets exist and the account can read them, /api/v1 answers 503 not_configured.
  - variable: RIVER_BRIDGE_REQUEST_KEYS
    value: "bridge-to-laundry-dev-v1,bridge-to-laundry-dev-v2"
    availability: [RUNTIME]
  # AI Companion on for dev only.
  # Test phase: "1" gives every tier Pro features (plans/prices still shown). Pair with config/flags.allFeaturesUnlocked in the db.
  - variable: ALL_FEATURES_UNLOCKED
    value: "1"
    availability: [BUILD, RUNTIME]
  - variable: COMPANION_ENABLED
    value: "1"
    availability: [BUILD, RUNTIME]
